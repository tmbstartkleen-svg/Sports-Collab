name: Council offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline council tests
        run: node --test test/council.test.js
      - name: Syntax check API and council modules
        run: |
          node --check api/council/run.js
          node --check api/council/status.js
          node --check api/council/provisioning.js
          node --check lib/council-engine.js
          node --check lib/live-access-policy.js
          node --check lib/provider-registry.js
          node --check lib/provider-config.js
          node --check lib/provider-provisioning.js
          node --check lib/provider-auth.js
          node --check lib/council-exchange.js
          node --check lib/muse-identity.js
          node --check api/council/exchange.js
          node --check lib/provider-adapters.js
          node --check lib/council-coordinator.js
          node --check test/council.test.js
