name: Prepare WebAuthn dependency lockfile (review only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/webauthn-lockfile-preparation.yml'
permissions:
  contents: write
jobs:
  prepare-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate registry-verified lockfile without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise actual SimpleWebAuthn verification exports
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {verifyRegistrationResponse,verifyAuthenticationResponse} from '@simplewebauthn/server';
          assert.equal(typeof verifyRegistrationResponse,'function');
          assert.equal(typeof verifyAuthenticationResponse,'function');
          const invalid = {response:{},expectedChallenge:'test',expectedOrigin:'https://example.com',expectedRPID:'example.com',requireUserVerification:true};
          for (const verify of [verifyRegistrationResponse,verifyAuthenticationResponse]) {
            let rejected = false;
            try { const result = await verify(invalid); rejected = result?.verified !== true; }
            catch { rejected = true; }
            assert.equal(rejected,true,'Malformed WebAuthn evidence must not verify');
          }
          NODE
      - name: Run offline unit tests
        run: npm test
      - name: Commit verified lockfile to feature branch only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/owner-auth-fail-closed'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already committed"
          else
            git commit -m "Commit registry-verified WebAuthn dependency lockfile"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - name: Upload lockfile for manual review
        uses: actions/upload-artifact@v4
        with:
          name: webauthn-package-lock-review
          path: package-lock.json
          retention-days: 7
