name: Council safety tests
on:
  push:
    branches:
      - feature/gemini-secure-scaffold
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline unit tests
        run: npm test
